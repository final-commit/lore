version: '3.9'

# Lore — self-hosted documentation platform
# Usage: docker compose up -d
# Docs: https://github.com/final-commit/lore

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lore-server
    restart: unless-stopped
    ports:
      - "3334:3334"
    environment:
      LORE_PORT: "3334"
      LORE_JWT_SECRET: "${LORE_JWT_SECRET:?Set LORE_JWT_SECRET in .env}"
      LORE_DB_PATH: "/data/lore.db"
      LORE_REPO_PATH: "/data/repo"
      LORE_SEARCH_INDEX_PATH: "/data/search_index"
      LORE_ATTACHMENT_PATH: "/data/attachments"
      LORE_EMOJI_PATH: "/data/emojis"
      # Optional: AI (OpenAI-compatible)
      LORE_AI_API_KEY: "${LORE_AI_API_KEY:-}"
      LORE_AI_BASE_URL: "${LORE_AI_BASE_URL:-https://api.openai.com/v1}"
      LORE_AI_MODEL: "${LORE_AI_MODEL:-gpt-4o-mini}"
      # Optional: OAuth (Google)
      LORE_OAUTH_GOOGLE_CLIENT_ID: "${LORE_OAUTH_GOOGLE_CLIENT_ID:-}"
      LORE_OAUTH_GOOGLE_CLIENT_SECRET: "${LORE_OAUTH_GOOGLE_CLIENT_SECRET:-}"
    volumes:
      - lore_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3334/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        LORE_BACKEND_URL: "http://lore-server:3334"
    container_name: lore-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      LORE_BACKEND_URL: "http://lore-server:3334"
      NODE_ENV: "production"
    depends_on:
      server:
        condition: service_healthy

  # ── Phase 2: Agent Docker executor ──────────────────────────────────────────
  # Activated in Phase 2 — required for agent execute:code and shell:run capabilities.
  # Uncomment this service when the lore-docker-executor image is available.
  #
  # lore-docker-executor:
  #   image: ghcr.io/final-commit/lore-docker-executor:latest
  #   container_name: lore-docker-executor
  #   restart: unless-stopped
  #   environment:
  #     EXECUTOR_LORE_URL: "http://lore-server:3334"
  #     EXECUTOR_JWT_SECRET: "${LORE_JWT_SECRET:?Set LORE_JWT_SECRET in .env}"
  #     EXECUTOR_MAX_CONCURRENT: "4"
  #     EXECUTOR_TIMEOUT_SECS: "30"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   depends_on:
  #     server:
  #       condition: service_healthy

volumes:
  lore_data:
    driver: local
